<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Alert Notification Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            /* --- Core Palette --- */
            --bg-dark: #0f172a;       /* Deep Midnight Blue */
            --bg-darker: #020617;     /* Almost Black */
            
            /* --- Glassmorphism Variables --- */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --glass-blur: blur(12px);
            
            /* --- Typography --- */
            --text-primary: #f1f5f9;  /* Bright White/Grey */
            --text-secondary: #94a3b8; /* Muted Blue/Grey */
            
            /* --- Status Indicators (Neon Glow) --- */
            --status-safe: #22d3ee;    /* Cyan Glow */
            --status-warning: #fbbf24; /* Amber Glow */
            --status-critical: #f43f5e; /* Rose Glow */
            
            /* --- Gradients --- */
            --grad-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34, 211, 238, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(118, 75, 162, 0.05), transparent 25%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .demo-container {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .demo-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--grad-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Alert Modal Styles */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.3s ease-in-out;
            backdrop-filter: blur(4px);
        }

        .alert-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        .alert-modal-content {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 40px;
            box-shadow: var(--glass-shadow), 0 0 40px rgba(34, 211, 238, 0.1);
            min-width: 70vw;
            max-width: 90vw;
            min-height: 40vh;
            overflow: hidden;
            border: 1px solid rgba(34, 211, 238, 0.2);
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 32px;
            padding: 40px;
            background: var(--grad-primary);
            color: white;
            position: relative;
        }

        .alert-icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            flex-shrink: 0;
        }

        .alert-icon {
            width: 60px;
            height: 60px;
            color: #fff;
        }

        .alert-title {
            margin: 0;
            font-size: 48px;
            font-weight: 700;
            color: white;
            flex: 1;
        }

        .alert-close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s;
            opacity: 0.8;
        }

        .alert-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            opacity: 1;
            transform: rotate(90deg);
        }

        .alert-body {
            padding: 60px;
            background: rgba(255, 255, 255, 0.02);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .alert-message {
            margin: 0;
            font-size: 42px;
            font-weight: 600;
            line-height: 1.9;
            color: var(--text-primary);
            word-wrap: break-word;
            white-space: pre-wrap;
            text-align: center;
        }

        .alert-footer {
            display: flex;
            gap: 12px;
            padding: 20px 24px;
            background: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            justify-content: flex-end;
        }

        .alert-btn-primary {
            padding: 10px 24px;
            background: var(--grad-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .alert-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .alert-btn-primary:active {
            transform: translateY(0);
        }

        .alert-btn-secondary {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .alert-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .alert-btn-secondary:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .alert-modal-content {
                min-width: auto;
                width: 90vw;
            }
        }


    </style>
</head>
<body>


    <!-- Alert Notification Modal -->
    <div id="alert-overlay" class="alert-overlay" style="display:none;"></div>
    <div id="alert-modal" class="alert-modal" style="display:none;">
        <div class="alert-modal-content">
            <div class="alert-header">
                <div class="alert-icon-container">
                    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <h2 id="alert-title" class="alert-title">Alert</h2>
            </div>
            <div class="alert-body">
                <p id="alert-message" class="alert-message">Alert message goes here</p>
            </div>
        </div>
    </div>


    <script>
        // Web Audio API for sound notifications
        let audioContext = null;

        /**
         * Generate and play a notification sound using Web Audio API
         * Creates a pleasant alert beep that's attention-grabbing but not harsh
         */
        function playNotificationSound() {
            try {
                // Initialize audio context if not already done
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                // Ensure audio context is not suspended (can happen on some browsers)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const now = audioContext.currentTime;
                const duration = 0.5; // 500ms total duration

                // Create oscillator for the tone
                const osc = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                // Connect nodes
                osc.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Set frequency: Start at 800Hz for attention
                osc.frequency.value = 800;
                
                // Create a quick pitch slide up for more attention-grabbing effect
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(800, now + duration);

                // Set volume with fade-in and fade-out
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);  // Fade in quickly
                gainNode.gain.setValueAtTime(0.3, now + 0.3);             // Hold at comfortable level
                gainNode.gain.linearRampToValueAtTime(0, now + duration); // Fade out

                // Set wave type for smoother sound
                osc.type = 'sine';

                // Play the sound
                osc.start(now);
                osc.stop(now + duration);

                // Optional: Play a second beep for additional emphasis
                setTimeout(() => {
                    try {
                        const osc2 = audioContext.createOscillator();
                        const gain2 = audioContext.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioContext.destination);

                        const now2 = audioContext.currentTime;
                        const duration2 = 0.3;

                        osc2.frequency.value = 600;
                        osc2.frequency.setValueAtTime(600, now2);
                        osc2.frequency.exponentialRampToValueAtTime(800, now2 + duration2);

                        gain2.gain.setValueAtTime(0, now2);
                        gain2.gain.linearRampToValueAtTime(0.2, now2 + 0.04);
                        gain2.gain.setValueAtTime(0.2, now2 + 0.15);
                        gain2.gain.linearRampToValueAtTime(0, now2 + duration2);

                        osc2.type = 'sine';
                        osc2.start(now2);
                        osc2.stop(now2 + duration2);
                    } catch (e) {
                        console.warn('Could not play second beep:', e.message);
                    }
                }, 300);

            } catch (error) {
                console.warn('Could not play notification sound:', error.message);
                // Fallback: Try system beep using a simple approach
                try {
                    // Mute and restore to create a visual notification if sound fails
                    console.log('⚠️ Sound notification unavailable, using visual alert only');
                } catch (e) {
                    console.warn('Sound notification error:', e.message);
                }
            }
        }

        // Alert Notification System
        function showAlert(title, message, options = {}) {
            const {
                autoClose = false,
                autoCloseDelay = 5000,
                timestamp = null,
                playSound = true  // Play sound by default for alerts
            } = options;

            const overlay = document.getElementById('alert-overlay');
            const modal = document.getElementById('alert-modal');
            const titleEl = document.getElementById('alert-title');
            const messageEl = document.getElementById('alert-message');

            // Set content
            titleEl.textContent = title;
            
            // Add timestamp if provided
            if (timestamp) {
                messageEl.innerHTML = `<strong>${timestamp}</strong><br/>${message}`;
            } else {
                messageEl.textContent = message;
            }

            // Show modal
            overlay.style.display = 'flex';
            modal.style.display = 'block';

            // Play notification sound
            if (playSound) {
                playNotificationSound();
            }

            // Auto-close if enabled
            if (autoClose) {
                setTimeout(() => {
                    if (modal.style.display !== 'none') {
                        closeAlert();
                    }
                }, autoCloseDelay);
            }

            return modal;
        }

        function closeAlert() {
            const overlay = document.getElementById('alert-overlay');
            const modal = document.getElementById('alert-modal');
            overlay.style.display = 'none';
            modal.style.display = 'none';
        }

        // Listen for alerts from main process
        window.addEventListener('DOMContentLoaded', () => {
            if (window.api && window.api.onShowAlert) {
                window.api.onShowAlert((data) => {
                    const { title, message, timestamp } = data;
                    showAlert(title, message, {
                        autoClose: true,
                        autoCloseDelay: 4000,
                        timestamp: timestamp,
                        playSound: true  // Always play sound for noise disturbance alerts
                    });
                });
            }
        });
    </script>
</body>
</html>
